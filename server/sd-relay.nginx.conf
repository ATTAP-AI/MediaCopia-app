# The Schedules Direct relay for MediaCopia's full TV guide (js/guide-sd.js).
#
# Schedules Direct's API can't be called from a web page (it sends no CORS headers), so the app calls
# this relay instead. It passes requests straight through and keeps nothing: each person signs in with
# their own Schedules Direct account, their password is SHA-1 hashed in the browser (as the API
# requires), and the access log should be off. Only that one API is reachable through it.
#
# To use it on your own server: put the `map` at http level (a file in sites-enabled is fine), put the
# `location` inside your site's HTTPS `server` block, set `access_log off;` for that server, and point
# MC.SD_RELAY in js/sync-config.js at https://<your-domain>/sd/.

# Other origins (e.g. a local copy at http://127.0.0.1:5173) that may call the relay. Pages served from
# the same domain as the relay need no entry. Use a regex entry (~^…$) for long hostnames.
map $http_origin $mc_sd_cors {
    default "";
    "http://127.0.0.1:5173" $http_origin;
}

# Inside: server { listen 443 ssl; server_name <your-domain>; access_log off; … }
location ^~ /sd/ {
    add_header Access-Control-Allow-Origin $mc_sd_cors always;
    add_header Access-Control-Allow-Headers "content-type, token" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    if ($request_method = OPTIONS) { return 204; }
    limit_except GET POST PUT OPTIONS { deny all; }
    client_max_body_size 256k;

    proxy_pass https://json.schedulesdirect.org/20141201/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host json.schedulesdirect.org;
    proxy_set_header User-Agent "MediaCopia/1.0";
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-For "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 90s;
}
